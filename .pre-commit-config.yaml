exclude: ^(\.planning/|fuzz/)
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        # The front-door corpus tests whitespace on purpose: trailing spaces and
        # tab-only lines inside its statements are the cases under test.
        exclude: ^test/sql/ddl_corpus_frontdoor_a\.test$
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false

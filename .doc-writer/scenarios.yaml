    scenarios:
      - id: S1
        goal: "I want to install the extension, define my first semantic view over a single table, and query it three different ways"
        starting_point: "docs/index.rst"
        persona_relevance: "First contact after arriving from Snowflake/Databricks. If I cannot get a working view and a result set inside ten minutes, I stop evaluating."
        done_when: "I have copy-pasteable install commands, a complete CREATE SEMANTIC VIEW example, query examples with expected output for the dimensions-only / metrics-only / both modes, and a way to see the SQL that was generated."
      - id: S2
        goal: "I want to model a star schema (fact table plus dimension tables), declare PK/FK relationships, query across them, and know which metric/dimension combinations are safe at which grain"
        starting_point: "docs/index.rst"
        persona_relevance: "Real analytics work is multi-table. I need to trust the generated joins and understand what happens when metrics sit at different grains -- that is exactly where a semantic layer either saves me or silently returns wrong numbers."
        done_when: "I have a multi-table DDL example with TABLES/RELATIONSHIPS/DIMENSIONS/METRICS, I can inspect the generated joins, and I understand the grain rules: which combinations are rejected, which are computed per-grain, and how to check before I write a query."
      - id: S3
        goal: "I want to compare this extension feature-by-feature with Snowflake Semantic Views and Databricks Metric Views so I can decide whether to adopt it"
        starting_point: "docs/index.rst"
        persona_relevance: "I heard about semantic views from Snowflake/Databricks. Before porting anything I need to know what maps across, what behaves differently, and what is simply absent."
        done_when: "I have concept-mapping tables for both platforms, side-by-side syntax, an explicit list of behavioural differences and unsupported features, and enough guidance to port an existing Snowflake CREATE SEMANTIC VIEW."
      - id: S4
        goal: "I want to define semantic views over Iceberg, Parquet and Postgres data and serve filtered, parameterised query results from an application"
        starting_point: "docs/index.rst"
        persona_relevance: "My target stack is DuckDB embedded in an app server reading Iceberg tables. I need source connectivity, per-request filtering (e.g. a date range chosen by the user), and a persistence/lifecycle story for the view definitions."
        done_when: "I can attach each source type, define a view over mixed sources, filter rows before aggregation for a request-scoped date range, and understand where the view definitions live and how an application should open the database."
      - id: S5
        goal: "I want to define semi-additive metrics for balance snapshots and window metrics for period-over-period analysis, then verify what SQL they generate"
        starting_point: "docs/index.rst"
        persona_relevance: "Financial and inventory reporting is why a semantic layer earns its keep -- last balance per account, rolling averages, rankings. These are the definitions that get computed inconsistently when every analyst writes them by hand."
        done_when: "I can write NON ADDITIVE BY and OVER metric definitions with confidence about the exact clause syntax and position, know when snapshot selection activates, know the mixing restrictions, and can inspect the generated CTEs."
      - id: S6
        goal: "I'm building a tool or agent that talks to DuckDB over SQL. I want to discover, over that SQL connection, what functions this extension provides, what parameters they take, and how to call them"
        starting_point: "docs/index.rst"
        persona_relevance: "The DuckDB + analytics-app stack increasingly includes an LLM agent or a BI/SQL tool that introspects the engine rather than reading a website. v0.13.0 advertises that every function the extension registers now carries a description, real parameter names and a runnable example in duckdb_functions(); I need to know how to use that."
        done_when: "I know the SQL query that returns the extension's function metadata and how to scope it to this extension's functions; I know which metadata columns carry the description, parameter names/types and example; I have an inventory of every function the extension registers, with which are meant to be called directly and which are internal (the table functions behind SHOW/DESCRIBE, the reserved search_path parameter); and each directly-callable function has a documented signature with an example."
      - id: S7
        goal: "I want to query my semantic view with the plain SELECT ... AGG(metric) ... GROUP BY form I use in Snowflake, filter it before and after aggregation, and call it from my Python app with a bound parameter"
        starting_point: "docs/index.rst"
        persona_relevance: "Coming from Snowflake, the standard-SQL form is how my analysts and BI tools already query semantic views. If it works here the same way, porting queries is copy-paste; if it differs, I need to know where before a query silently changes meaning."
        done_when: "I have a runnable example with output, know how GROUP BY / AGG / WHERE / HAVING map onto dimensions, metrics and the two filters, know what is refused and how to work around it (joins, windows, SELECT *), can pass a request value as a parameter from Python, and can see the SQL the extension generates."
      - id: S8
        goal: "I want to know when a mistake in my view definition (a misspelled column, a missing table) is reported, and what the error looks like, so I can catch it in CI rather than from a dashboard"
        starting_point: "docs/index.rst"
        persona_relevance: "I keep view definitions in version control and deploy them with a script. A definition that is accepted and then fails on first query breaks a dashboard in production; one that fails at CREATE breaks my deploy, which is where I want it."
        done_when: "I know that CREATE (and CREATE OR REPLACE, IF NOT EXISTS, FROM YAML) binds every member and what it does not check, I know the error message format, I know a refused CREATE OR REPLACE leaves the old view in place, and I know which failures can still surface only at query time."

name: DuckDB Version Monitor
on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly, Monday 09:00 UTC
  workflow_dispatch:       # Allow manual trigger for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  check-latest:
    name: Check for new DuckDB latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: recursive
          token: ${{ secrets.VERSION_MONITOR_PAT || secrets.GITHUB_TOKEN }}

      - name: Get latest DuckDB release
        id: latest
        run: |
          LATEST=$(gh api repos/duckdb/duckdb/releases/latest --jq '.tag_name')
          CURRENT=$(cat .duckdb-version)
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          # Newer, not merely different: the pin can be ahead of the latest
          # release (a 2.0 pre-release while 1.5.x is still "latest"), and that
          # must not be "bumped" back. A release is newer than a pre-release of
          # the same version (v2.0.0 > v2.0.0-alpha47600).
          IS_NEW=$(python3 - "$CURRENT" "$LATEST" <<'PY'
          import re, sys
          def key(tag):
              m = re.match(r"^v(\d+)\.(\d+)\.(\d+)(-.+)?$", tag)
              if not m:
                  sys.exit(f"unexpected DuckDB version {tag!r}")
              return (*map(int, m.groups()[:3]), m.group(4) is None)
          current, latest = sys.argv[1:]
          print("true" if key(latest) > key(current) else "false")
          PY
          )
          echo "is_new=$IS_NEW" >> $GITHUB_OUTPUT
          echo "Latest DuckDB: $LATEST (current pin: $CURRENT, newer: $IS_NEW)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already up to date
        if: steps.latest.outputs.is_new == 'false'
        run: echo "Already on latest DuckDB ${{ steps.latest.outputs.current }}. No action needed."

      - name: Install just
        if: steps.latest.outputs.is_new == 'true'
        uses: extractions/setup-just@v4

      - name: Install Rust stable
        if: steps.latest.outputs.is_new == 'true'
        uses: dtolnay/rust-toolchain@stable

      # Pre-install the pinned toolchain so the `make` build below doesn't hit
      # cargo's flake-prone lazy rustup install. See the composite action.
      - name: Install pinned Rust toolchain
        if: steps.latest.outputs.is_new == 'true'
        uses: ./.github/actions/setup-pinned-rust

      - name: Update version pins
        if: steps.latest.outputs.is_new == 'true'
        run: |
          # Only the ENGINE pin moves. The C API pin (.duckdb-capi-version, the
          # duckdb/libduckdb-sys crates and MINIMUM_DUCKDB_VERSION) stays where it
          # is: the extension declares the v1.5.6 C API on purpose (see the
          # Makefile's UNSTABLE_C_API_FLAG), and moving it is a deliberate change,
          # not a weekly bump.
          VER="${{ steps.latest.outputs.latest }}"
          echo "$VER" > .duckdb-version
          # A release's wheel is the version without its `v`; the pre-release
          # wheel name is only needed while the pin is a pre-release.
          rm -f .duckdb-pypi-version

          # Update Python PEP 723 headers. The `[0-9]` prefix is required: an
          # unanchored `[0-9.]*` also matches the empty string, which mangles
          # non-pin occurrences such as an f-string `duckdb=={pyver}` into
          # `duckdb==X.Y.Z{pyver}`. `[0-9a-z.]*` also takes a pre-release
          # suffix (2.0.0.dev2610151406) along.
          DDB_VER=$(echo $VER | sed 's/v//')
          find . -name '*.py' -not -path './extension-ci-tools/*' -not -path './.venv/*' -not -path './.engine/*' -exec \
            sed -i "s/duckdb==[0-9][0-9a-z.]*/duckdb==$DDB_VER/" {} \;

          # Update CI workflow files: the engine ref and the IMPORTANT comment.
          # A release has its tag upstream, so the `duckdb_tag` stand-in a
          # pre-release needs goes. extension-ci-tools is versioned apart from
          # DuckDB since 2.0 (one `v2.0-<codename>` branch per release line), so
          # its ref and the submodule stay; a new release line needs them moved
          # by hand, and the build below fails until they are.
          for WF in .github/workflows/BuildAll.yml .github/workflows/BuildQuick.yml; do
            sed -i "s/duckdb_version: [^ ]*/duckdb_version: $VER/" "$WF"
            sed -i "/^ *duckdb_tag: /d" "$WF"
            sed -i "s/currently v[^ )]*/currently $VER/" "$WF"
          done

      - name: Record changelog entry
        if: steps.latest.outputs.is_new == 'true'
        run: |
          VER="${{ steps.latest.outputs.latest }}"
          # Idempotent: re-running for the same version is a no-op (the monitor
          # force-pushes its branch weekly). The publish workflow later rolls this
          # [Unreleased] bullet into a versioned section at release time.
          python3 scripts/changelog_add_bullet.py Changed "DuckDB version pin bumped to \`${VER}\`."

      - name: Build and test against new DuckDB version
        if: steps.latest.outputs.is_new == 'true'
        id: build
        run: |
          # Pin-consistency first: `make test_release` runs sqllogictest, which
          # never reads the Rust-side pins, so a location the step above missed
          # would sail through and open a "build passed" PR that CI then rejects.
          # These are pure-Rust unit tests — no C++ build needed.
          SV_SKIP_CPP_BUILD=1 cargo test --lib --no-default-features --features extension
          # `make release` builds the new engine from its PyPI sdist first
          # (scripts/ensure_engine.py); that is most of this step's time.
          make configure && make release && make test_release
        continue-on-error: true

      - name: Run DuckLake integration test
        if: steps.latest.outputs.is_new == 'true'
        id: ducklake_test
        run: |
          pip install uv
          SEMANTIC_VIEWS_EXTENSION_PATH=build/release/semantic_views.duckdb_extension \
            uv run test/integration/test_ducklake_ci.py
        continue-on-error: true

      - name: Open version-bump PR (build passed)
        if: steps.latest.outputs.is_new == 'true' && steps.build.outcome == 'success'
        run: |
          VER="${{ steps.latest.outputs.latest }}"
          BRANCH="chore/duckdb-bump-${VER}"
          DUCKLAKE="${{ steps.ducklake_test.outcome == 'success' && '✓ passed' || '✗ failed (see run log)' }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: bump DuckDB pin to ${VER}"
          git push --force -u origin "$BRANCH"
          if ! gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            cat > /tmp/pr-body.md <<EOF
          Automated version bump to DuckDB ${VER}.

          Build and tests passed on Linux x86_64. The full platform matrix will run once this PR merges to \`main\`.

          DuckLake compatibility: ${DUCKLAKE}

          ---
          *Generated by DuckDB Version Monitor workflow.*
          EOF
            gh pr create --base main --title "chore: bump DuckDB pin to ${VER}" --body-file /tmp/pr-body.md
          fi
        env:
          GH_TOKEN: ${{ secrets.VERSION_MONITOR_PAT || secrets.GITHUB_TOKEN }}

      - name: Open breakage PR (build failed)
        if: steps.latest.outputs.is_new == 'true' && steps.build.outcome == 'failure'
        run: |
          VER="${{ steps.latest.outputs.latest }}"
          BRANCH="fix/duckdb-breakage-${VER}"
          DUCKLAKE="${{ steps.ducklake_test.outcome == 'success' && '✓ passed' || '✗ failed or skipped' }}"
          BUILD_LOG="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: attempt bump to DuckDB ${VER}"
          git push --force -u origin "$BRANCH"
          if ! gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            cat > /tmp/pr-body.md <<EOF
          Build against DuckDB ${VER} failed.

          @copilot please update the DuckDB version pin and fix any compilation errors.

          DuckLake compatibility: ${DUCKLAKE}

          Build log: ${BUILD_LOG}

          ---
          *Generated by DuckDB Version Monitor workflow.*
          EOF
            gh pr create --base main --title "fix: DuckDB ${VER} broke the build" --body-file /tmp/pr-body.md
          fi
        env:
          GH_TOKEN: ${{ secrets.VERSION_MONITOR_PAT || secrets.GITHUB_TOKEN }}

  check-lts:
    name: Check for new DuckDB LTS release
    runs-on: ubuntu-latest
    steps:
      - name: Check if LTS branch exists
        id: branch_check
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" duckdb/1.4.x >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Branch duckdb/1.4.x does not exist — skipping LTS check."
          fi

      - uses: actions/checkout@v7
        if: steps.branch_check.outputs.exists == 'true'
        with:
          ref: duckdb/1.4.x
          submodules: recursive
          token: ${{ secrets.VERSION_MONITOR_PAT || secrets.GITHUB_TOKEN }}

      - name: Get latest DuckDB 1.4.x release
        if: steps.branch_check.outputs.exists == 'true'
        id: lts
        run: |
          # Query all releases, filter for v1.4.* tags, take the newest
          LATEST_LTS=$(gh api repos/duckdb/duckdb/releases --paginate --jq '[.[] | select(.tag_name | startswith("v1.4")) | .tag_name] | first')
          CURRENT=$(cat .duckdb-version)
          echo "latest=$LATEST_LTS" >> $GITHUB_OUTPUT
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          if [ "$LATEST_LTS" != "$CURRENT" ]; then
            echo "is_new=true" >> $GITHUB_OUTPUT
          else
            echo "is_new=false" >> $GITHUB_OUTPUT
          fi
          echo "Latest DuckDB LTS: $LATEST_LTS (current pin: $CURRENT)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already up to date
        if: steps.lts.outputs.is_new == 'false'
        run: echo "Already on latest LTS ${{ steps.lts.outputs.current }}. No action needed."

      - name: Install just
        if: steps.lts.outputs.is_new == 'true'
        uses: extractions/setup-just@v4

      - name: Install Rust stable
        if: steps.lts.outputs.is_new == 'true'
        uses: dtolnay/rust-toolchain@stable

      # Pre-install the pinned toolchain so the `make` build below doesn't hit
      # cargo's flake-prone lazy rustup install. See the composite action.
      - name: Install pinned Rust toolchain
        if: steps.lts.outputs.is_new == 'true'
        uses: ./.github/actions/setup-pinned-rust

      - name: Update LTS version pins
        if: steps.lts.outputs.is_new == 'true'
        run: |
          # Update .duckdb-version
          echo "${{ steps.lts.outputs.latest }}" > .duckdb-version

          # Update Cargo.toml duckdb/libduckdb-sys pins (LTS uses simple version scheme)
          LTS_VER=$(echo "${{ steps.lts.outputs.latest }}" | sed 's/v//')
          sed -i "s/duckdb = { version = \"=[^\"]*\"/duckdb = { version = \"=$LTS_VER\"/" Cargo.toml
          sed -i "s/libduckdb-sys = \"=[^\"]*\"/libduckdb-sys = \"=$LTS_VER\"/" Cargo.toml

          # Update the version declared to the loader at extension init. Guarded
          # by tests::duckdb_version_pins_agree, which fails the build if this
          # drifts from .duckdb-version.
          sed -i "s|\(MINIMUM_DUCKDB_VERSION: &str = \)\"v[0-9.]*\"|\1\"v$LTS_VER\"|" src/lib.rs

          # Update Python PEP 723 headers. The `[0-9]` prefix is required: an
          # unanchored `[0-9.]*` also matches the empty string, which mangles
          # non-pin occurrences such as the f-string `duckdb=={pyver}` in
          # scripts/fetch_amalgamation_offline.py into `duckdb==X.Y.Z{pyver}`.
          find . -name '*.py' -not -path './extension-ci-tools/*' -not -path './.venv/*' -exec \
            sed -i "s/duckdb==[0-9][0-9.]*/duckdb==$LTS_VER/" {} \;

          # Update CI workflow files (uses:, duckdb_version, ci_tools_version, IMPORTANT comment)
          LTS_TAG="v$LTS_VER"
          for WF in .github/workflows/BuildAll.yml .github/workflows/BuildQuick.yml; do
            sed -i "s|extension-ci-tools/\.github/workflows/_extension_distribution\.yml@v[0-9.]*|extension-ci-tools/.github/workflows/_extension_distribution.yml@$LTS_TAG|" "$WF"
            sed -i "s/duckdb_version: v[0-9.]*/duckdb_version: $LTS_TAG/" "$WF"
            sed -i "s/ci_tools_version: v[0-9.]*/ci_tools_version: $LTS_TAG/" "$WF"
            sed -i "s/currently v[0-9.]*/currently $LTS_TAG/" "$WF"
          done

          # Update extension-ci-tools submodule to matching branch. The refspec
          # must be explicit and the failure must be fatal — see the equivalent
          # block in the check-latest job for why a bare `git fetch origin`
          # silently no-ops under actions/checkout's --depth=1 submodule clone.
          git -C extension-ci-tools fetch --depth=1 origin "+refs/heads/$LTS_TAG:refs/remotes/origin/$LTS_TAG"
          git -C extension-ci-tools checkout --detach "refs/remotes/origin/$LTS_TAG"
          echo "extension-ci-tools submodule -> $LTS_TAG ($(git -C extension-ci-tools rev-parse --short HEAD))"

          # Download new amalgamation
          just update-headers

      - name: Record changelog entry (LTS)
        if: steps.lts.outputs.is_new == 'true'
        run: |
          VER="${{ steps.lts.outputs.latest }}"
          python3 scripts/changelog_add_bullet.py Changed "DuckDB LTS version pin bumped to \`${VER}\`."

      - name: Build and test against new LTS version
        if: steps.lts.outputs.is_new == 'true'
        id: build
        run: |
          # Pin-consistency first: `make test_release` runs sqllogictest, which
          # never reads the Rust-side pins, so a location the step above missed
          # would sail through and open a "build passed" PR that CI then rejects.
          # These are pure-Rust unit tests — no C++ build needed.
          SV_SKIP_CPP_BUILD=1 cargo test --lib --no-default-features --features extension
          make configure && make release && make test_release
        continue-on-error: true

      - name: Run DuckLake integration test
        if: steps.lts.outputs.is_new == 'true'
        id: ducklake_test
        run: |
          pip install uv
          SEMANTIC_VIEWS_EXTENSION_PATH=build/release/semantic_views.duckdb_extension \
            uv run test/integration/test_ducklake_ci.py
        continue-on-error: true

      - name: Open LTS version-bump PR (build passed)
        if: steps.lts.outputs.is_new == 'true' && steps.build.outcome == 'success'
        run: |
          VER="${{ steps.lts.outputs.latest }}"
          BRANCH="chore/duckdb-lts-bump-${VER}"
          DUCKLAKE="${{ steps.ducklake_test.outcome == 'success' && '✓ passed' || '✗ failed (see run log)' }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(lts): bump DuckDB LTS pin to ${VER}"
          git push --force -u origin "$BRANCH"
          if ! gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            cat > /tmp/pr-body.md <<EOF
          Automated LTS version bump to DuckDB ${VER}.

          Build and tests passed on Linux x86_64. Full platform matrix runs on push to \`duckdb/1.4.x\`.

          DuckLake compatibility: ${DUCKLAKE}

          ---
          *Generated by DuckDB Version Monitor workflow (LTS track).*
          EOF
            gh pr create --base duckdb/1.4.x --title "chore(lts): bump DuckDB LTS pin to ${VER}" --body-file /tmp/pr-body.md
          fi
        env:
          GH_TOKEN: ${{ secrets.VERSION_MONITOR_PAT || secrets.GITHUB_TOKEN }}

      - name: Open LTS breakage PR (build failed)
        if: steps.lts.outputs.is_new == 'true' && steps.build.outcome == 'failure'
        run: |
          VER="${{ steps.lts.outputs.latest }}"
          BRANCH="fix/duckdb-lts-breakage-${VER}"
          DUCKLAKE="${{ steps.ducklake_test.outcome == 'success' && '✓ passed' || '✗ failed or skipped' }}"
          BUILD_LOG="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(lts): attempt bump to DuckDB ${VER}"
          git push --force -u origin "$BRANCH"
          if ! gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            cat > /tmp/pr-body.md <<EOF
          LTS build against DuckDB ${VER} failed.

          @copilot please update the DuckDB LTS version pin and fix any compilation errors.

          DuckLake compatibility: ${DUCKLAKE}

          Build log: ${BUILD_LOG}

          ---
          *Generated by DuckDB Version Monitor workflow (LTS track).*
          EOF
            gh pr create --base duckdb/1.4.x --title "fix(lts): DuckDB ${VER} broke the LTS build" --body-file /tmp/pr-body.md
          fi
        env:
          GH_TOKEN: ${{ secrets.VERSION_MONITOR_PAT || secrets.GITHUB_TOKEN }}

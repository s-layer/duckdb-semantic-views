name: Integration Checks

on:
  # push to main = post-merge validation; pull_request = every PR, same-repo AND
  # fork (fork PRs don't fire this repo's push events — CI-2). push is main-only,
  # so a same-repo PR's branch push does NOT trigger this workflow and the PR
  # runs exactly once via pull_request — no fork guard needed. Keep the
  # paths-ignore list in sync with BuildAll / BuildQuick / CodeQuality.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '_notes/**'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '_notes/**'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The DuckLake and sqllogictest jobs load the SAME debug extension, so it is
  # built once here and downloaded by both, instead of each running its own
  # identical ~6-minute `make configure debug`. That is ~6 minutes less runner
  # occupancy per PR, at the cost of ~1 minute of wall clock (they cannot start
  # until this finishes) — the right trade for this repo, where runner minutes
  # are free on a public repo but jobs have queued for over an hour when several
  # run at once, and concurrent demand is what causes that.
  #
  # `python-integration` deliberately does NOT share it; see the comment on that
  # job. Attempting to share it is what broke this workflow the first time.
  #
  # Only the extension itself is shared. `configure/venv` is NOT: the DuckLake
  # suite runs under `uv` with its own PEP 723 dependencies and never touches
  # it, and the sqllogictest job recreates it with a bare `make configure`
  # (seconds) because the runner lives inside it.
  build-debug-extension:
    name: Build debug extension (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Pre-install the toolchain pinned in rust-toolchain.toml before `make`
      # runs cargo, so cargo's flake-prone lazy rustup install is a no-op. See
      # the composite action for the full rationale.
      - name: Install pinned Rust toolchain
        uses: ./.github/actions/setup-pinned-rust

      # The DuckDB engine the C++ shim links against is built from source
      # (scripts/ensure_engine.py, run by `make debug`), which takes far longer
      # than the extension itself. It only changes with the engine pins or the
      # script that builds it, so the build is cached across runs.
      - name: Cache the DuckDB engine build
        uses: actions/cache@v4
        with:
          path: .engine
          key: duckdb-engine-${{ runner.os }}-${{ hashFiles('.duckdb-version', '.duckdb-pypi-version', 'scripts/ensure_engine.py') }}

      - name: Build extension
        run: make configure debug

      # ~388 MB uncompressed, ~123 MB in the artifact (deflate gets ~3.15x on
      # this binary). Only the loadable extension is uploaded — `make debug`
      # also leaves two identical copies (libsemantic_views.so and
      # build/debug/extension/...) that nothing downstream reads, and including
      # them would triple the transfer for no gain.
      - name: Upload debug extension
        uses: actions/upload-artifact@v7
        with:
          name: debug-extension
          path: build/debug/semantic_views.duckdb_extension
          if-no-files-found: error
          retention-days: 1

  ducklake-ci-check:
    name: DuckLake integration test (Linux x86_64)
    runs-on: ubuntu-latest
    needs: build-debug-extension
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download debug extension
        uses: actions/download-artifact@v8
        with:
          name: debug-extension
          path: build/debug

      - name: Install uv
        run: pip install uv

      - name: Run DuckLake CI integration test
        run: uv run test/integration/test_ducklake_ci.py
        env:
          SEMANTIC_VIEWS_EXTENSION_PATH: build/debug/semantic_views.duckdb_extension

  # No `needs:` — this job builds its own extension, so making it wait for
  # `build-debug-extension` would add ~6 minutes of wall clock for an artifact
  # it never downloads.
  python-integration:
    name: Python integration suites (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Pre-install the toolchain pinned in rust-toolchain.toml before `make`
      # runs cargo, so cargo's flake-prone lazy rustup install is a no-op. See
      # the composite action for the full rationale.
      - name: Install pinned Rust toolchain
        uses: ./.github/actions/setup-pinned-rust

      # This job builds its own extension rather than downloading the shared
      # artifact, unlike the other two. `just test-integration` fans out to ~19
      # leaf recipes (test-caret, test-adbc, …) and EACH of them declares
      # `build` as a dependency, so the recipe graph re-enters `make debug`
      # whatever CI does first. Downloading the artifact and skipping the build
      # step therefore failed with `check_configure` ("The configure step
      # appears to not be run") — and even with `make configure` added it would
      # have rebuilt from an empty target/, saving nothing.
      #
      # Making this shareable means moving the `build` dependency off the 19
      # leaves and onto a single `test-integration` entry point, so a
      # `-prebuilt` variant can exist the way `test-sql-prebuilt` does. That is
      # a behaviour change for anyone running one leaf directly (`just
      # test-caret` would stop building first), so it is left alone here rather
      # than bundled into a CI change.
      # The DuckDB engine the C++ shim links against is built from source
      # (scripts/ensure_engine.py, run by `make debug`), which takes far longer
      # than the extension itself. It only changes with the engine pins or the
      # script that builds it, so the build is cached across runs.
      - name: Cache the DuckDB engine build
        uses: actions/cache@v4
        with:
          path: .engine
          key: duckdb-engine-${{ runner.os }}-${{ hashFiles('.duckdb-version', '.duckdb-pypi-version', 'scripts/ensure_engine.py') }}

      - name: Build extension
        run: make configure debug

      - name: Install uv
        run: pip install uv

      - name: Install just
        uses: taiki-e/install-action@just

      # Runs the same suite list as local `just test-all`, minus the three
      # suites with their own jobs in this file / CodeQuality.yml: test-rust
      # (CodeQuality's "Doctests & extension unit tests" + "Coverage"),
      # test-sql (the `sqllogictest` job below) and test-ducklake-ci (the
      # `ducklake-ci-check` job above). The list itself lives in the Justfile's
      # `test-integration` recipe so local dev and CI cannot drift.
      #
      # That list includes `test-examples` (every examples/*.py, run under
      # `uv run --script` against this job's extension; fails on any non-zero
      # exit -- see scripts/run_examples.py for its two explicit allow-lists)
      # and `test-sqllogictest-guards` (proves the sqllogictest wrapper the
      # `sqllogictest` job below runs through fails a run that skips
      # `require semantic_views`, executes nothing, or waves a network error
      # through as a pass), and `test-multi-statement-error`. These need network:
      # uv fetches each example's PEP 723 dependencies.
      # SV_OFFLINE_EXTENSIONS is refused here because CI is set.
      - name: Run Python integration suites
        run: just test-integration

  # THIS is the authoritative sqllogictest gate. BuildQuick / BuildAll also
  # invoke `make test_release`, but that is a no-op on linux_amd64 — see the CI
  # Workflows section of MAINTAINER.md for which platforms actually test. Do not
  # remove this job believing the build workflows cover it.
  #
  # It works precisely BECAUSE `DUCKDB_PLATFORM` is unset here. base.Makefile
  # turns the test target into `tests_skipped` when that variable names a
  # platform on its SKIP_TESTS list, and `linux_amd64` is on it (an upstream
  # glibc-wheel issue). The reusable build workflow exports DUCKDB_PLATFORM; we
  # do not, so none of those `ifeq`s match and the suite actually runs. Do not
  # set DUCKDB_PLATFORM in this job — it would silently turn the gate back off
  # while leaving the step green.
  sqllogictest:
    name: SQL logic tests (Linux x86_64)
    runs-on: ubuntu-latest
    needs: build-debug-extension
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download debug extension
        uses: actions/download-artifact@v8
        with:
          name: debug-extension
          path: build/debug

      # `configure` (venv + platform metadata) only, not `debug`: the runner is
      # the duckdb-sqllogictest package installed into configure/venv, and
      # `check_configure` asserts configure/{platform.txt,venv} exist. Seconds,
      # against ~6 minutes for a rebuild of a binary we just downloaded.
      - name: Configure test venv
        run: make configure

      - name: Install just
        uses: taiki-e/install-action@just

      # `test-sql-prebuilt` is `test-sql` minus the build — same body, so the
      # two cannot drift, and `_ensure-test-deps` still runs (it reinstalls the
      # venv's `duckdb` pip package when it is not the engine release the
      # extension is built for, so the runner cannot test against a different DuckDB than the one the
      # extension was built for). Plain `just test-sql` would rebuild the
      # extension this job just downloaded.
      #
      # The runner is scripts/run_sqllogictest.py (the Makefile's TEST_RUNNER),
      # not the bare `python -m duckdb_sqllogictest`: it fails the run when
      # `require semantic_views` would be SKIPPED (a missing or renamed
      # extension file), when a listed file never runs, and when a file runs
      # zero statements, or when a file hits an "HTTP" / "Unable to connect"
      # error (the runner's ignore_error_messages count those as a pass) --
      # all of which the bare runner reports as success.
      # Its last line, "sqllogictest: N file(s) ran, M statements/queries
      # executed", is the check that the suite really ran.
      - name: Run SQL logic tests
        run: just test-sql-prebuilt

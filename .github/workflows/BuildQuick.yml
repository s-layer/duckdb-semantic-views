name: "Build Extension: Quick (Linux x86_64)"

on:
  # No `push` trigger (runs on pull_request + manual workflow_dispatch).
  # BuildAll.yml runs the full platform matrix on pushes to main, so this quick
  # Linux-only build exists purely for fast PR feedback — on every PR,
  # same-repo AND fork (fork PRs don't fire this repo's push events, so a
  # pull_request trigger is the only way they get a build — CI-2). No push
  # trigger, so a same-repo PR builds exactly once and nothing double-runs. Skip
  # documentation/text-only changes (validated by DocsCheck.yml); keep the
  # paths-ignore list in sync with BuildAll / CodeQuality / IntegrationChecks.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '_notes/**'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries (Linux x86_64)
    # IMPORTANT: the engine below must be the release in .duckdb-version (currently v2.0.0-alpha47600).
    # GitHub Actions 'uses:' does not support dynamic values, so update these
    # manually whenever .duckdb-version changes; tests::duckdb_derived_pins_agree
    # checks them. extension-ci-tools is versioned apart from DuckDB since 2.0
    # (one `v2.0-<codename>` branch per release line), so its ref only has to be
    # the same in both places.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      # The pre-release engine has no release tag upstream, so this is the
      # commit its wheel was built from, and duckdb_tag labels the clone with
      # the release (the Makefile's set_duckdb_tag; scripts/ensure_engine.py
      # builds a tagged tree under its tag). At a GA release, put the tag here
      # and drop duckdb_tag.
      duckdb_version: d4355d01c59362d57036ad377735dd5340276a5b
      duckdb_tag: v2.0.0-alpha47600
      ci_tools_version: v2.0-cyanoptera
      extension_name: semantic_views
      extra_toolchains: 'rust;python3'
      # Only Linux x86_64 for fast branch feedback — the full matrix runs on main.
      # Verified arch names from extension-ci-tools/config/distribution_matrix.json.
      exclude_archs: 'linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

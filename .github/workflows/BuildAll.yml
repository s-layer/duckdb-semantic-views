name: "Build Extension: All Platforms"

on:
  push:
    branches: ["main"]
    # Skip the full-matrix build for documentation/text-only changes (the docs
    # site itself is validated by Docs.yml / DocsCheck.yml). A commit that also
    # touches any non-doc file still triggers a build. Keep this list in sync
    # with BuildQuick / CodeQuality / IntegrationChecks.
    paths-ignore:
      - '**/*.md'
      - '_notes/**'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries (all platforms)
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    # IMPORTANT: the engine below must be the release in .duckdb-version (currently v2.0.0).
    # GitHub Actions 'uses:' does not support dynamic values, so update these
    # manually whenever .duckdb-version changes; tests::duckdb_derived_pins_agree
    # checks them. extension-ci-tools is versioned apart from DuckDB since 2.0
    # (one `v2.0-<codename>` branch per release line), so its ref only has to be
    # the same in both places.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      # A release is pinned by its tag. A pre-release has no tag upstream: pin
      # the commit its wheel was built from and add a `duckdb_tag` input naming
      # the release, which labels the clone (the Makefile's set_duckdb_tag;
      # scripts/ensure_engine.py builds a tagged tree under its tag).
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: semantic_views
      extra_toolchains: 'rust;python3'
      exclude_archs: 'linux_amd64_musl;linux_arm64_musl;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

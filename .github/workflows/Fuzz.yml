name: Fuzz
on:
  push:
    tags-ignore:
      - '**'
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/Fuzz.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  FUZZ_TIME: 600  # 10 minutes per target
  RUSTUP_TOOLCHAIN: nightly  # override rust-toolchain.toml (cargo-fuzz needs nightly)

jobs:
  # GitHub evaluates the `paths:` filter above against the commits a push
  # *introduces*, not the push's net diff (see the "Gotcha" under CI Workflows in
  # MAINTAINER.md). So restarting a feature branch on top of already-merged
  # history re-triggers the whole 8 x 10-minute matrix even for a docs-only
  # change: the squash-merge commit that became newly reachable carries `src/**`.
  # This job re-checks the *net* diff and skips the matrix when nothing the
  # fuzzers exercise actually changed.
  #
  # It fails OPEN — anything unexpected (new branch, unavailable before-commit,
  # manual dispatch) fuzzes rather than skips. That includes this job itself
  # failing: the matrix gates on `should_fuzz != 'false'` behind `!cancelled()`,
  # not on `== 'true'`, so a crashed or errored guard leaves the output empty and
  # the matrix still runs. Gating on `== 'true'` would be fail-CLOSED, because a
  # failed `needs` job skips its dependents by default and fuzzing would silently
  # stop. Only an explicit `false` — or a cancelled run — skips it.
  #
  # Guarding here rather than moving to a `pull_request` trigger keeps the CI-2
  # properties intact: fuzzing stays on same-repo pushes, never on untrusted fork
  # code, and retains the `issues: write` token that fork PRs cannot grant.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      should_fuzz: ${{ steps.check.outputs.should_fuzz }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          run_fuzz() { echo "$1"; echo "should_fuzz=true" >> "$GITHUB_OUTPUT"; exit 0; }

          [ "$EVENT_NAME" = "push" ] || run_fuzz "Event is '$EVENT_NAME', not a push — fuzzing."

          case "$BEFORE" in
            ''|0000000000000000000000000000000000000000)
              run_fuzz "No before-commit (new branch) — fuzzing." ;;
          esac
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
            || run_fuzz "Before-commit $BEFORE unavailable — fuzzing."

          # Two-dot (tree-vs-tree) diff: the net effect of the push, which is
          # what the `paths:` filter above should have matched on.
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
            src fuzz Cargo.toml Cargo.lock .github/workflows/Fuzz.yml)

          if [ -n "$changed" ]; then
            echo "Net diff touches fuzzed paths:"
            echo "$changed" | sed 's/^/  /'
            echo "should_fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "Push introduces commits touching fuzzed paths, but its net diff does not."
            echo "Nothing for the fuzzers to exercise — skipping the matrix."
            echo "should_fuzz=false" >> "$GITHUB_OUTPUT"
          fi

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: changes
    # `!cancelled()` is load-bearing: without a status-check function the matrix
    # is skipped whenever `changes` fails, turning the guard fail-closed.
    if: ${{ !cancelled() && needs.changes.outputs.should_fuzz != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with fuzz/fuzz_targets/ AND the `fuzz-all` Justfile recipe
        # (all nine targets must be listed — fuzz_yaml_parse and
        # the then parser-override target were missing here until 2026-07-02, and
        # fuzz_where_predicate was missing from `fuzz-all` until 2026-08-04).
        target: [fuzz_json_parse, fuzz_sql_expand, fuzz_query_names, fuzz_ddl_parse, fuzz_yaml_parse, fuzz_create_text, fuzz_keyword_body, fuzz_render_roundtrip, fuzz_where_predicate]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz

      - name: Build fuzz target
        run: cargo fuzz build ${{ matrix.target }}

      - name: Run fuzzer
        run: |
          # libFuzzer refuses to start if the corpus/seeds directories are
          # absent (they are gitignored), exiting instantly — so create them
          # first. Without this, 7 of 8 targets fuzzed nothing yet went green.
          mkdir -p fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }}
          set +e
          cargo fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} -- -max_total_time=${{ env.FUZZ_TIME }}
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          # A non-zero exit WITH a crash artifact is a real finding — the
          # "Check for crash artifacts" step (and its uploader/issue/fail
          # steps) owns that path, so let this step succeed and hand off.
          if find fuzz/artifacts/${{ matrix.target }} -type f \( -name 'crash-*' -o -name 'oom-*' -o -name 'timeout-*' -o -name 'slow-unit-*' \) 2>/dev/null | grep -q .; then
            echo "Fuzzer exited $rc with crash artifacts present — handled by crash-detection steps."
            exit 0
          fi
          # Non-zero with NO artifacts means the fuzzer failed to start (bad
          # corpus dir, build/link error, OOM before writing). Fail loudly
          # instead of masking it with a trailing || true.
          echo "::error::cargo fuzz run ${{ matrix.target }} failed to start (exit $rc) with no crash artifacts"
          exit $rc

      - name: Check for crash artifacts
        id: check
        run: |
          if find fuzz/artifacts/${{ matrix.target }} -type f \( -name 'crash-*' -o -name 'oom-*' -o -name 'timeout-*' -o -name 'slow-unit-*' \) 2>/dev/null | grep -q .; then
            echo "crash_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "crash_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload crash artifacts
        if: steps.check.outputs.crash_found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: crash-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts/${{ matrix.target }}/

      - name: Open issue on crash
        if: steps.check.outputs.crash_found == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fuzz crash: ${{ matrix.target }}`,
              body: [
                'Fuzzing found a crash in `${{ matrix.target }}`.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Download the crash artifact and reproduce locally:',
                '```bash',
                '# 1. Download the artifact from the Actions run linked above',
                '#    (Artifacts section at the bottom of the run page)',
                '# 2. Unzip and reproduce:',
                'cargo +nightly fuzz run ${{ matrix.target }} fuzz/artifacts/${{ matrix.target }}/<crash-file>',
                '```',
              ].join('\n'),
              labels: ['bug', 'fuzzing']
            })

      - name: Fail job on crash
        if: steps.check.outputs.crash_found == 'true'
        run: |
          echo "::error::Fuzzer found a crash in ${{ matrix.target }} — see uploaded artifacts"
          exit 1
